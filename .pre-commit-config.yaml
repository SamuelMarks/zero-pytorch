repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check (Fix)
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: check-typing-and-docs
        name: Check Typing and Docstrings
        entry: env PYTHONPATH=src:../ml-switcheroo-ir/src:../ml-switcheroo-compiler/src python3 scripts/check_typing_and_docs.py
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Interrogate Docstrings
        entry: interrogate -v --fail-under 100 src/zero_torch scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Mypy Strict Type Check
        entry: env PYTHONPATH=src:../ml-switcheroo-ir/src:../ml-switcheroo-compiler/src mypy --strict src/zero_torch scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Run Pytest Coverage
        entry: bash -c "PYTHONPATH=../ml-switcheroo-ir/src:../ml-switcheroo-compiler/src:src pytest --cov=src/zero_torch --cov-branch --cov-report=term-missing --cov-fail-under=100"
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update Coverage Shields
        entry: python3 scripts/update_badges.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-dependencies
        name: Check Dependencies
        entry: python3 scripts/check_dependencies.py
        language: system
        files: ^(src|tests|scripts)/.*\.py$
        pass_filenames: false

      - id: check-api-compliance
        name: Check API Conformance
        entry: env PYTHONPATH=src:../ml-switcheroo-ir/src:../ml-switcheroo-compiler/src python3 scripts/check_compliance.py
        language: system
        files: ^(SEMANTIC_PLAN\.md|src/.*\.py)$
        pass_filenames: false

      - id: check-api-snapshots
        name: Check API Snapshots
        entry: env PYTHONPATH=src:../ml-switcheroo-ir/src:../ml-switcheroo-compiler/src python3 scripts/check_api_snapshots.py
        language: system
        files: ^(src/.*\.py|ml_snapshots\.txt)$
        pass_filenames: false

      - id: build
        name: Build Package
        entry: python3 -m build
        language: system
        pass_filenames: false
