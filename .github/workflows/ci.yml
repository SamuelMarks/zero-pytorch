name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov pytest-xdist interrogate mypy build
        pip install "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        pip install "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl"
        pip install "ml-switcheroo-compiler @ https://github.com/SamuelMarks/ml-switcheroo-compiler/releases/download/v0.0.1/ml_switcheroo_compiler-0.0.1-py3-none-any.whl"
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        pip install -e .

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Check Dependencies
      run: python scripts/check_dependencies.py

    - name: Check Typing and Docstrings
      run: |
        PYTHONPATH=.:src python scripts/check_typing_and_docs.py
        interrogate -v --fail-under 100 src/zero_torch scripts
        PYTHONPATH=.:src mypy --strict src/zero_torch scripts

    - name: Test & Coverage
      run: |
        PYTHONPATH=.:src pytest tests --cov=src/zero_torch --cov=scripts --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=100

    - name: API Snapshots & Compliance Check
      run: |
        PYTHONPATH=.:src python scripts/check_compliance.py
        PYTHONPATH=.:src python scripts/check_api_snapshots.py

    - name: Update Badges
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
