name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7

    - uses: actions/checkout@v7
      with:
        repository: SamuelMarks/ml-switcheroo-ir
        path: ml-switcheroo-ir

    - uses: actions/checkout@v7
      with:
        repository: SamuelMarks/ml-switcheroo-compiler
        path: ml-switcheroo-compiler

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov pytest-xdist interrogate mypy build
        pip install -e ./ml-switcheroo-ir
        pip install -e ./ml-switcheroo-compiler
        pip install https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.4/ml_ecosystem_snapshots-0.0.4-py3-none-any.whl
        pip install -e .
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Check Code Formatting (Ruff)
      run: ruff format --check .

    - name: Check Linting (Ruff)
      run: ruff check .

    - name: Check Dependencies
      run: python scripts/check_dependencies.py

    - name: Check Typing and Docstrings
      run: |
        PYTHONPATH=src:./ml-switcheroo-ir/src:./ml-switcheroo-compiler/src python scripts/check_typing_and_docs.py
        interrogate -v --fail-under 100 src/zero_torch scripts
        PYTHONPATH=src:./ml-switcheroo-ir/src:./ml-switcheroo-compiler/src mypy --strict src/zero_torch scripts

    - name: Test & Coverage
      run: |
        PYTHONPATH=src:./ml-switcheroo-ir/src:./ml-switcheroo-compiler/src pytest --cov=src/zero_torch --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=100

    - name: API Snapshots & Compliance Check
      run: |
        PYTHONPATH=src:./ml-switcheroo-ir/src:./ml-switcheroo-compiler/src python scripts/check_compliance.py
        PYTHONPATH=src:./ml-switcheroo-ir/src:./ml-switcheroo-compiler/src python scripts/check_api_snapshots.py

    - name: Update Badges
      run: |
        python scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run pre-commit or the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
