[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "zero-pytorch"
version = "2.10.0"
description = "Zero-dependency pure Python implementation of the PyTorch API surface."
authors = [{ name = "Samuel Marks" }]
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/zero_torch"]

[tool.ruff]

[tool.coverage.run]
source = ["src/zero_torch"]
omit = [
    "tests/*",
    "scripts/*",
    "embed_stubs.py",
    "fix_*.py",
    "generate_*.py",
]

[tool.coverage.report]

[tool.mypy]
overrides = [
    { module = "ml_switcheroo.*", ignore_missing_imports = true },
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]
